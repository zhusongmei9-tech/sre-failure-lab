name: sre-lab

x-api: &api
  pull_policy: never
  restart: unless-stopped
  cpus: ${API_CPUS:-1.0}
  mem_limit: ${API_MEMORY_LIMIT:-256m}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  environment:
    REDIS_URL: redis://redis:6379/0
    REDIS_TIMEOUT_SECONDS: "0.5"
    CACHE_TTL_SECONDS: "60"
    LAB_ENABLED: "true"
    LAB_TOKEN: ${LAB_TOKEN:?Initialize .env first}
    FALLBACK_ENABLED: "true"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api-blue:
    <<: *api
    image: ${BLUE_IMAGE:-sre-lab-api:0.3.0}
    ports: ["127.0.0.1:18001:8000"]
    profiles: [slots]
  api-green:
    <<: *api
    image: ${GREEN_IMAGE:-sre-lab-api:0.3.0}
    ports: ["127.0.0.1:18002:8000"]
    profiles: [slots]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
  edge:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${RUNTIME_BIND_HOST:-0.0.0.0}:18000:8080"]
    volumes: ["./runtime/nginx:/etc/nginx/conf.d:ro"]
    mem_limit: 64m
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus/runtime.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/slo.yml:/etc/prometheus/slo.yml:ro
      - ./runtime/prometheus:/etc/prometheus/targets:ro
      - runtime-prometheus:/prometheus
    extra_hosts: ["metrics-host:host-gateway"]
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports: ["${RUNTIME_BIND_HOST:-0.0.0.0}:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Initialize .env first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - runtime-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 512m
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    command:
      - --path.rootfs=/host
      - --web.listen-address=${METRICS_HOST_GATEWAY:?Set host Docker bridge address}:9100
    volumes: ["/:/host:ro,rslave"]
    mem_limit: 128m
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    cgroup: host
    read_only: true
    cap_drop: [ALL]
    command: ["--docker_only=false", "--store_container_labels=false", "--enable_metrics=cpu,memory", "--housekeeping_interval=5s"]
    volumes: ["/sys:/sys:ro"]
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 256m

volumes:
  runtime-prometheus:
  runtime-grafana:
