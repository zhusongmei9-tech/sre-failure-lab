[project]
name = "sre-failure-lab"
version = "0.6.0"
description = "A local SRE failure lab with FastAPI and Redis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "redis>=5,<8",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "fakeredis>=2.26,<3",
    "ruff>=0.9,<1",
    "httpx2>=2.16.0",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
