---
- name: Converge the SRE lab on a Linux systemd host
  hosts: sre_lab
  become: true
  serial: 1
  vars:
    sre_root: /opt/sre-failure-lab
  tasks:
    - name: Require an installer with the read-only preview interface
      ansible.builtin.assert:
        that:
          - "'SRE_LAB_SYSTEMD_CHANGED=' in lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/install_systemd.sh')"
        fail_msg: Use the playbook and lifecycle installer from the same source release.

    - name: Check the supported host and target interpreter
      ansible.builtin.assert:
        that:
          - sre_root == '/opt/sre-failure-lab'
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['service_mgr'] == 'systemd'

    - name: Check the Python used by systemd
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "import sys; sys.exit(sys.version_info < (3, 9))"]
      check_mode: false
      changed_when: false

    - name: Check Docker Compose availability
      ansible.builtin.command: docker compose version --short
      check_mode: false
      changed_when: false

    - name: List existing project containers including stopped ones
      ansible.builtin.command: docker ps -aq --filter label=com.docker.compose.project=sre-lab
      register: sre_containers
      check_mode: false
      changed_when: false

    - name: Inspect installation path
      ansible.builtin.stat:
        path: "{{ sre_root }}"
      register: sre_directory

    - name: Require a regular install directory
      ansible.builtin.assert:
        that: not sre_directory.stat.exists or sre_directory.stat.isdir

    - name: Inspect staged source
      ansible.builtin.stat:
        path: "{{ sre_root }}/compose.runtime.yaml"
      register: sre_compose

    - name: Check whether the runtime was initialized
      ansible.builtin.stat:
        path: "{{ sre_root }}/runtime/state.json"
        get_checksum: false
      register: sre_state

    - name: Examine the initialized runtime before changing host files
      ansible.builtin.script:
        cmd: "{{ (playbook_dir ~ '/../scripts/install_systemd.sh') | quote }} --check"
        executable: /bin/bash
      when: sre_state.stat.exists
      check_mode: false
      changed_when: false
      register: sre_systemd_plan

    - name: Prepare first-time installation
      ansible.builtin.include_tasks: bootstrap.yml
      when: not sre_state.stat.exists

    - name: Report the first-time installation plan on a new target
      ansible.builtin.debug:
        msg: >-
          Would stage source if needed, initialize the private environment, prepare images,
          initialize the blue slot, install systemd units, and verify readiness and product 1.
          The actual downloads, systemd plan, and runtime probes require an applied installation.
      when: ansible_check_mode and not sre_state.stat.exists
      changed_when: true

    - name: Install and verify the lifecycle manager
      when: not ansible_check_mode or sre_state.stat.exists
      block:
        - name: Stage the lifecycle installer and unit definitions
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ item }}"
            dest: "{{ sre_root }}/{{ item }}"
            owner: root
            group: root
            mode: "{{ '0755' if item.endswith('.sh') else '0644' }}"
          loop:
            - scripts/install_systemd.sh
            - ops/sre-lab.service
            - ops/sre-lab-healer.service

        - name: Show pending systemd changes for currently staged units
          ansible.builtin.debug:
            msg: "{{ sre_systemd_plan.stdout_lines }}"
          when: ansible_check_mode
          changed_when: "'SRE_LAB_SYSTEMD_CHANGED=1' in sre_systemd_plan.stdout_lines"

        - name: Converge systemd and verify the running containers
          ansible.builtin.command:
            argv: [/bin/bash, scripts/install_systemd.sh]
            chdir: "{{ sre_root }}"
          register: sre_systemd_apply
          changed_when: "'SRE_LAB_SYSTEMD_CHANGED=1' in sre_systemd_apply.stdout_lines"
          failed_when: >-
            sre_systemd_apply.rc != 0 or
            ('SRE_LAB_SYSTEMD_CHANGED=0' not in sre_systemd_apply.stdout_lines and
             'SRE_LAB_SYSTEMD_CHANGED=1' not in sre_systemd_apply.stdout_lines)
          when: not ansible_check_mode

        - name: Verify full API and Redis readiness through the edge
          ansible.builtin.uri:
            url: http://127.0.0.1:18000/health/ready
            use_proxy: false
          register: sre_ready
          until: >-
            sre_ready.status == 200 and
            (sre_ready.json | default({})).get('status') == 'ready' and
            (sre_ready.json | default({})).get('redis') == 'ok'
          retries: 5
          delay: 2
          when: not ansible_check_mode

        - name: Verify product 1 through the same edge
          ansible.builtin.uri:
            url: http://127.0.0.1:18000/products/1
            use_proxy: false
          register: sre_product
          failed_when: sre_product.status != 200 or (sre_product.json | default({})).get('id') != 1
          when: not ansible_check_mode
