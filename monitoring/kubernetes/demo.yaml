apiVersion: v1
kind: Namespace
metadata:
  name: sre-k8s-demo
  labels:
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: demo
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: sre-k8s-demo
spec:
  hard:
    pods: "3"
    requests.cpu: 100m
    requests.memory: 64Mi
    limits.cpu: 300m
    limits.memory: 96Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: sre-k8s-demo
  labels:
    app: demo-web
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: demo-web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: demo-web
        app.kubernetes.io/part-of: sre-failure-lab
        app.kubernetes.io/managed-by: sre-failure-lab
        sre-lab-role: demo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Docker Official Image; pinned version includes linux/arm64 and amd64.
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - printf 'SRE Kubernetes demo is ready\n' > /www/index.html; exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: content
              mountPath: /www
      volumes:
        - name: content
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: sre-k8s-demo
spec:
  type: ClusterIP
  selector:
    app: demo-web
  ports:
    - name: http
      port: 8080
      targetPort: http
