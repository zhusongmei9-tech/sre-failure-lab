apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sre-app-lab
  labels:
    app: redis
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: product-lab
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: sre-failure-lab
        app.kubernetes.io/managed-by: sre-failure-lab
        sre-lab-role: product-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --save, "", --appendonly, "no", --maxmemory, 24mb, --maxmemory-policy, allkeys-lru]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sre-app-lab
  labels:
    app: redis
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: product-lab
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-product-api
  namespace: sre-app-lab
  labels:
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: product-lab
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: product-api
      ports:
        - protocol: TCP
          port: 6379
