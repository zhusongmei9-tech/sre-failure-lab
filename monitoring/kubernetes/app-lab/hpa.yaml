apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-api
  namespace: sre-app-lab
  labels:
    app.kubernetes.io/part-of: sre-failure-lab
    app.kubernetes.io/managed-by: sre-failure-lab
    sre-lab-role: product-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Short lab window so the return to one replica is visible during a demo.
      stabilizationWindowSeconds: 45
