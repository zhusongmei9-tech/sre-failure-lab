apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-k8s-alert-receiver
  namespace: sre-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: sre-k8s-alert-receiver}
  template:
    metadata:
      labels: {app: sre-k8s-alert-receiver}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: receiver
          # Same multi-architecture official base as the project Dockerfile.
          image: python:3.12-slim
          command: [python, -B, /app/receiver.py]
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: sre-k8s-alert-receiver-code
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: sre-k8s-alert-receiver
  namespace: sre-monitoring
  labels: {app: sre-k8s-alert-receiver}
spec:
  type: ClusterIP
  selector: {app: sre-k8s-alert-receiver}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-k8s-alert-receiver
  namespace: sre-monitoring
  labels: {release: sre-k8s}
spec:
  selector:
    matchLabels: {app: sre-k8s-alert-receiver}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-k8s-alert-receiver
  namespace: sre-monitoring
spec:
  podSelector:
    matchLabels: {app: sre-k8s-alert-receiver}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: alertmanager}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
