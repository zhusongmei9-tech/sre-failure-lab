global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

scrape_configs:
  - job_name: api
    scrape_timeout: 3s
    static_configs:
      - targets: ["api:8000"]
  - job_name: node
    scrape_timeout: 4s
    static_configs:
      - targets: ["metrics-host:9100"]
  - job_name: cadvisor
    scrape_timeout: 4s
    static_configs:
      - targets: ["cadvisor:8080"]
