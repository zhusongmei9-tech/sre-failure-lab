groups:
  - name: lab_slo
    rules:
      - record: lab:slo_success_ratio:5m
        expr: (sum(rate(lab_http_requests_total{job="api",status_code=~"2.."}[5m])) / sum(rate(lab_http_requests_total{job="api"}[5m]))) and on() (sum(rate(lab_http_requests_total{job="api"}[5m])) > 0)
      - record: lab:slo_success_ratio:1h
        expr: (sum(rate(lab_http_requests_total{job="api",status_code=~"2.."}[1h])) / sum(rate(lab_http_requests_total{job="api"}[1h]))) and on() (sum(rate(lab_http_requests_total{job="api"}[1h])) > 0)
      - record: lab:slo_burn_rate:5m
        expr: (1 - lab:slo_success_ratio:5m) / 0.01
      - record: lab:slo_burn_rate:1h
        expr: (1 - lab:slo_success_ratio:1h) / 0.01
      - alert: LabSLOFastBurn
        expr: (lab:slo_burn_rate:5m > 14.4) and on() (lab:slo_burn_rate:1h > 14.4) and on() (sum(increase(lab_http_requests_total{job="api"}[5m])) >= 100) and on() (sum(increase(lab_http_requests_total{job="api"}[1h])) >= 1000)
        for: 2m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: Product request SLO budget is burning quickly
          description: 99 percent request-based target; 429 and all non-2xx count as failures. Both 5m and 1h burn rates exceed 14.4 with minimum traffic.
          runbook: docs/slo-reports.md
