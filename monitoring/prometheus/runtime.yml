global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml
scrape_configs:
  - job_name: api
    file_sd_configs:
      - files: [/etc/prometheus/targets/active.json]
        refresh_interval: 5s
  - job_name: api_slots
    static_configs:
      - targets: [api-blue:8000]
        labels: {slot: blue}
      - targets: [api-green:8000]
        labels: {slot: green}
  - job_name: node
    static_configs:
      - targets: [metrics-host:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
