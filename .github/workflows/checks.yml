name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency manager
        run: python -m pip install uv==0.9.5
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test (real Redis test skips without TEST_REDIS_SERVER)
        run: uv run --locked pytest -q
      - name: Compile Python
        run: uv run --locked python -m compileall -q app scripts tests loadgen ops
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Console DOM contract tests (not rendering)
        run: node --test tests/console.test.cjs
