name: Publish source release

on:
  workflow_run:
    workflows: ["Python checks"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}
jobs:
  release:
    if: >-
      github.repository == 'zhusongmei9-tech/sre-failure-lab' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.path == '.github/workflows/checks.yml' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: source-release-v0.6.0
      # Keep superseded runs from replacing a newer head in the pending queue.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CI, package the source and update the existing attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_source_release.py
