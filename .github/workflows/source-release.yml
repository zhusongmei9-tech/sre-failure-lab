name: Publish source release

on:
  push:
    branches: [main]
    paths: [.github/workflows/source-release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-v0.4.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zhusongmei9-tech/sre-failure-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: 566ae2c8dd826a39e07a9e0227035b684c08055d
      RELEASE_TAG: v0.4.0
      ASSET_NAME: sre-faliure-lab-v0.4.0.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 566ae2c8dd826a39e07a9e0227035b684c08055d
          fetch-depth: 0
          persist-credentials: false
      - name: Build the source archive from the verified commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert 'v' + version == os.environ['RELEASE_TAG'], 'Source version mismatch'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for path in filter(None, paths):
              parts = Path(path).parts
              assert parts[0] not in {'private', 'runtime', 'reports', 'dist', '.venv'}, path
              assert not path.endswith(('.kubeconfig', '.pem', '.key', '.local.yml')), path
              assert not (Path(path).name.startswith('.env') and Path(path).name != '.env.example'), path
          for path in ['scripts/install_k3s.sh', 'scripts/install_k8s_monitoring.sh',
                       'scripts/install_k8s_grafana.sh', 'scripts/accept_k8s.py',
                       'monitoring/grafana/dashboards/kubernetes.json',
                       'docs/kubernetes-monitoring.md', 'docs/kubernetes-validation-137.md']:
              assert path in paths, f'Missing Kubernetes source: {path}'
          PY
          mkdir -p dist/source-release
          prefix="sre-failure-lab-${RELEASE_TAG}"
          git archive --format=tar --prefix="${prefix}/" "$SOURCE_SHA" | gzip -n > "dist/source-release/${ASSET_NAME}"
          cd dist/source-release
          tar -tzf "$ASSET_NAME" > /dev/null
          sha256sum "$ASSET_NAME"
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GH_REPO']
          source = os.environ['SOURCE_SHA']
          tag = os.environ['RELEASE_TAG']
          base = f'repos/{repo}'
          marker = f'<!-- source-release: {source} -->'
          folder = Path('dist/source-release')
          name = os.environ['ASSET_NAME']
          archive = (folder / name).read_bytes()
          digest = hashlib.sha256(archive).hexdigest()

          def gh(*args):
              return subprocess.run(['gh', *args], check=True, capture_output=True).stdout

          def api(path, *args, missing_ok=False):
              result = subprocess.run(['gh', 'api', path, *args], capture_output=True)
              if result.returncode:
                  if missing_ok and '(HTTP 404)' in result.stderr.decode():
                      return None
                  raise RuntimeError(result.stderr.decode())
              return json.loads(result.stdout)

          def verify_tag(required=True):
              ref = api(f'{base}/git/ref/tags/{tag}', missing_ok=not required)
              if ref is None:
                  return False
              obj = ref['object']
              for _ in range(10):
                  if obj['type'] != 'tag':
                      break
                  obj = api(f'{base}/git/tags/{obj["sha"]}')['object']
              if obj['type'] != 'commit' or obj['sha'] != source:
                  raise RuntimeError('Existing tag points to a different source commit')
              return True

          def find_release():
              matches = []
              page = 1
              while True:
                  batch = api(f'{base}/releases?per_page=100&page={page}')
                  matches.extend(item for item in batch if item['tag_name'] == tag)
                  if len(batch) < 100:
                      break
                  page += 1
              if len(matches) > 1:
                  raise RuntimeError('Multiple releases use this tag')
              return api(f'{base}/releases/{matches[0]["id"]}') if matches else None

          runs = api(f'{base}/actions/runs?head_sha={source}&per_page=100')['workflow_runs']
          checks = [run for run in runs if run['path'] == '.github/workflows/checks.yml'
                    and run['event'] == 'push' and run['head_branch'] == 'main']
          if not checks or max(checks, key=lambda run: run['id'])['conclusion'] != 'success':
              raise RuntimeError('The source commit must have a successful Python checks run')

          release = find_release()
          if release and marker not in (release.get('body') or ''):
              raise RuntimeError('Existing release is not owned by this source publication')
          if not verify_tag(required=bool(release and not release['draft'])):
              api(f'{base}/git/refs', '--method', 'POST', '-f', f'ref=refs/tags/{tag}',
                  '-f', f'sha={source}')
          verify_tag()

          notes = f'''{marker}
          SRE 故障演练实验室 {tag}：新增 Kubernetes 单节点监控。

          **下载源码：[{name}](https://github.com/{repo}/releases/download/{tag}/{name})**

          保留 FastAPI 商品查询、Redis 缓存、故障演练、真实自愈、资源监控、蓝绿发布与回滚、systemd 管理。

          本版新增：
          - K3s 单节点安装脚本与固定版本校验，独立运行于原有 Compose 业务旁。
          - Prometheus Operator、kube-state-metrics、node_exporter 与受限资源配置。
          - 复用 Grafana 的 Kubernetes 看板：节点 CPU/内存/磁盘、Pod 资源/重启、Deployment 副本、PVC 和采集状态。
          - 自动验收脚本及演示 Pod 删除后自动补建；systemd 管理监控桥接服务。
          - 安装、停机和排障步骤见包内 docs/kubernetes-monitoring.md；实测记录见 docs/kubernetes-validation-137.md。

          验证与边界：
          - 源码提交：`{source}`；该提交 GitHub Actions 代码检查已通过。
          - 137 ARM64 实测：8 个采集目标全 UP、48 次看板查询通过；一次演示 Pod 删除后 5.88 秒重新 Ready。这是单次实验观测，不是恢复时间承诺。
          - 安装脚本支持 Linux AMD64/ARM64，现场仅验证 ARM64；尚未实测 AMD64 安装、整机重启恢复或全新机器离线安装。
          - 原有业务仍运行在 Docker Compose；单节点集群不提供跨主机高可用，尚未配置外部告警通知。
          - 这是源码包，不含 Docker/K3s 镜像、凭据或运行数据；首次安装需联网拉取依赖与镜像。

          只需下载上面的一个附件。解压：`tar -xzf {name}`。

          SHA-256：`{digest}`

          运行 `sha256sum {name}` 与摘要比较，无需另下校验文件。
          '''
          if release is None:
              # Keep the returned ID; a new draft may not appear in the list immediately.
              release = api(f'{base}/releases', '--method', 'POST',
                            '-f', f'tag_name={tag}', '-f', f'target_commitish={source}',
                            '-f', f'name={tag} · Kubernetes 监控版',
                            '-f', f'body={notes}', '-F', 'draft=true', '-F', 'prerelease=false')

          def assets_for(release_id):
              assets = api(f'{base}/releases/{release_id}/assets?per_page=100')
              if len(assets) > 1 or any(asset['name'] != name for asset in assets):
                  raise RuntimeError('Unexpected assets; refusing to change release')
              return assets

          def verify_asset(asset):
              if asset['name'] != name or asset['state'] != 'uploaded' or asset['size'] != len(archive):
                  raise RuntimeError('Incomplete or conflicting source archive')
              data = gh('api', f'{base}/releases/assets/{asset["id"]}',
                        '-H', 'Accept: application/octet-stream')
              if hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('Source archive checksum mismatch')

          assets = assets_for(release['id'])
          if not assets:
              if not release['draft']:
                  raise RuntimeError('Published source archive is missing')
              gh('api', f'https://uploads.github.com/{base}/releases/{release["id"]}/assets?name={name}',
                 '--method', 'POST', '-H', 'Content-Type: application/octet-stream',
                 '--input', str(folder / name))
          assets = assets_for(release['id'])
          if len(assets) != 1:
              raise RuntimeError('The release must contain exactly one source asset')
          verify_asset(assets[0])
          verify_tag()
          if release['draft']:
              api(f'{base}/releases/{release["id"]}', '--method', 'PATCH',
                  '-f', f'body={notes}', '-F', 'draft=false', '-f', 'make_latest=true')
          published = api(f'{base}/releases/{release["id"]}')
          if published['draft'] or published['prerelease']:
              raise RuntimeError('Release was not published as a stable version')
          if (published.get('body') or '') != notes:
              raise RuntimeError('Published release notes differ; refusing to overwrite')
          verify_tag()
          verify_asset(assets_for(release['id'])[0])
          print(published['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Source release: {published["html_url"]}\n\nCommit: `{source}`\n\n')
              summary.write(f'One source archive: `{name}`\n\nSHA-256: `{digest}`\n')
          PY
